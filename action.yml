name: SPIFFE Conformance Test Suite
description: Run the SPIFFE conformance test suite against an SDK harness binary.
branding:
  icon: shield
  color: blue

inputs:
  cmd:
    description: Path to the SDK harness binary to test.
    required: true
  args:
    description: Comma-separated arguments to pass to the harness.
    required: false
    default: ''
  tests:
    description: Comma-separated list of test cases to run (e.g. X1,J3). Empty runs all.
    required: false
    default: ''
  output:
    description: 'Format of the log output: text or json.'
    required: false
    default: text
  parallel:
    description: Number of test cases to run concurrently.
    required: false
    default: '1'
  results-file:
    description: If set, the results are also written to this file as JSON.
    required: false
    default: ''
  verbose:
    description: Enable verbose logging.
    required: false
    default: 'false'
  suite-version:
    description: Version of the conformance suite to install (git ref, tag, or "latest").
    required: false
    default: latest
  go-version:
    description: Go version to set up for installing the suite.
    required: false
    default: stable

# The action fails only if test cases could not be executed (status ERROR).
# Test results (PASS/FAIL/SKIP) are reported through the outputs below and do
# not fail the action; gate on them in your workflow if you want to.
outputs:
  results-file:
    description: Path to the JSON results file.
    value: ${{ steps.run.outputs.results-file }}
  passed:
    description: Number of test cases that passed.
    value: ${{ steps.run.outputs.passed }}
  failed:
    description: Number of test cases that failed (the SDK did not conform).
    value: ${{ steps.run.outputs.failed }}
  skipped:
    description: Number of test cases that were skipped.
    value: ${{ steps.run.outputs.skipped }}
  errors:
    description: Number of test cases that could not be executed.
    value: ${{ steps.run.outputs.errors }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}

    - name: Install conformance suite
      shell: bash
      run: |
        set -euo pipefail
        go install "github.com/arndt-s/spiffe-conformance-test-suite/cmd/suite@${{ inputs.suite-version }}"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Run conformance suite
      id: run
      shell: bash
      env:
        INPUT_CMD: ${{ inputs.cmd }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_TESTS: ${{ inputs.tests }}
        INPUT_PARALLEL: ${{ inputs.parallel }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_RESULTS_FILE: ${{ inputs.results-file }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
      run: |
        set -uo pipefail
        results="${INPUT_RESULTS_FILE:-$RUNNER_TEMP/spiffe-conformance-results.json}"
        flags=( --cmd "$INPUT_CMD" --output "$INPUT_OUTPUT" --results-file "$results" --parallel "$INPUT_PARALLEL" )
        if [ -n "$INPUT_ARGS" ]; then
          flags+=( --args "$INPUT_ARGS" )
        fi
        if [ -n "$INPUT_TESTS" ]; then
          flags+=( --tests "$INPUT_TESTS" )
        fi
        if [ "$INPUT_VERBOSE" = "true" ]; then
          flags+=( --verbose )
        fi

        suite run "${flags[@]}"
        status=$?

        if [ -f "$results" ]; then
          echo "results-file=$results" >> "$GITHUB_OUTPUT"
          for k in passed failed skipped errors; do
            echo "$k=$(jq -r ".$k" "$results")" >> "$GITHUB_OUTPUT"
          done
          {
            echo "### SPIFFE conformance results"
            echo
            echo "| Passed | Failed | Skipped | Errors |"
            echo "| --- | --- | --- | --- |"
            jq -r '"| \(.passed) | \(.failed) | \(.skipped) | \(.errors) |"' "$results"
            echo
            echo "| Feature | Claim | MUST passed | MUST failed | MUST skipped | MUST errors |"
            echo "| --- | --- | --- | --- | --- | --- |"
            jq -r '.claims[] | select(.status != "not-run") | "| \(.feature) | \(.status) | \(.must_passed) | \(.must_failed) | \(.must_skipped) | \(.must_errors) |"' "$results"
            echo
            echo "| Test | Level | Status | Message |"
            echo "| --- | --- | --- | --- |"
            jq -r '.results[] | "| \(.name) | \(.level) | \(.status) | \((.message // "") | gsub("\\|"; "\\\\|") | gsub("\n"; " ")) |"' "$results"
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        exit $status
